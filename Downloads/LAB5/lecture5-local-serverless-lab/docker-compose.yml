version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - serverless_network

  event_source:
    build: ./event_source
    container_name: event_source
    environment:
      - REDIS_HOST=redis
      - WATCH_DIR=/data/input
    volumes:
      - ./data/input:/data/input
      - ./data/output:/data/output
    depends_on:
      - redis
      - router
    networks:
      - serverless_network
    restart: always

  router:
    build: ./router
    container_name: router
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
      - image_resizer
      - notifier
    networks:
      - serverless_network
    restart: always

  image_resizer:
    build: ./functions/image_resizer
    container_name: image_resizer
    ports:
      - "5001:5000"
    environment:
      - OUTPUT_PATH=/data/output
    volumes:
      - ./data/input:/data/input
      - ./data/output:/data/output
    networks:
      - serverless_network
    restart: always

  notifier:
    build: ./functions/notifier
    container_name: notifier
    ports:
      - "5003:5000"
    environment:
      - LOG_PATH=/data/output/notifications.log
    volumes:
      - ./data/output:/data/output
    networks:
      - serverless_network
    restart: always

networks:
  serverless_network:
    driver: bridge